<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mix elettrico Italia</title>
<style>
  body{margin:0;background:#161310;color:#EDE0C8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .box{width:100%;max-width:440px;background:#1f1a14;border:.5px solid #3a3128;border-radius:12px;padding:26px}
  h1{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#8a7c66;margin:0 0 6px;text-align:center;font-weight:500}
  .tot{text-align:center;font-size:26px;margin-bottom:22px}
  .tot span{font-size:12px;color:#8a7c66}
  .r{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12.5px}
  .n{width:112px;flex-shrink:0;color:#8a7c66}
  .t{flex:1;height:8px;background:#3a3128;border-radius:4px;overflow:hidden}
  .f{height:100%;background:#9c3a2e;border-radius:4px}
  .p{width:46px;text-align:right}
  .ft{text-align:center;font-size:10.5px;color:#8a7c66;margin-top:20px;line-height:1.6}
  .s{text-align:center;color:#8a7c66;font-size:13px;padding:30px 0}
</style>
</head>
<body>
<div class="box">
  <h1>Mix elettrico Italia</h1>
  <div id="c"><div class="s">Carico…</div></div>
</div>

<script>
async function carica(){
  const c = document.getElementById('c');
  try{
    const d = await (await fetch('/.netlify/functions/mix',{cache:'no-store'})).json();
    if(d.error){ c.innerHTML = '<div class="s">'+d.error+'</div>'; return; }

    const max = d.fonti[0].pct;
    let h = '<div class="tot">'+d.totaleMw.toLocaleString('it-IT')+' <span>MW in produzione</span></div>';

    d.fonti.forEach(f=>{
      h += '<div class="r"><div class="n">'+f.nome+'</div>'
         + '<div class="t"><div class="f" style="width:'+(f.pct/max*100)+'%"></div></div>'
         + '<div class="p">'+f.pct+'%</div></div>';
    });

    h += '<div class="ft">Aggiornato alle '
       + new Date(d.aggiornato).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Rome'})
       + ' · fonte ENTSO-E<br>Percentuali sulla generazione nazionale, escluse le importazioni.</div>';

    c.innerHTML = h;
  }catch(e){
    c.innerHTML = '<div class="s">Errore di connessione.</div>';
  }
}
carica();
setInterval(carica, 300000);
</script>
</body>
</html>
