<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meteo Elettrico — Italia</title>
<style>
  :root{
    --nero:#161310; --nero2:#1f1a14; --seppia:#EDE0C8; --seppia-dim:#8a7c66;
    --rosso:#9c3a2e; --bordo:#3a3128; --verde:#5c7a4f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--nero); color:var(--seppia);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:20px;
  }
  .card{ width:100%; max-width:560px; background:var(--nero2); border:0.5px solid var(--bordo); border-radius:14px; padding:26px; }
  h1{ font-size:13px; font-weight:500; letter-spacing:1.5px; text-transform:uppercase; color:var(--seppia-dim); margin:0 0 20px; text-align:center; }
  .icona{ font-size:52px; text-align:center; line-height:1; margin-bottom:4px; }
  .dominante{ text-align:center; font-size:19px; margin-bottom:6px; }
  .badge{ display:inline-block; padding:3px 10px; border-radius:14px; font-size:11px; margin-left:8px; vertical-align:middle; }
  .badge.verde{background:rgba(92,122,79,0.25);color:#9dc189;}
  .badge.giallo{background:rgba(184,146,58,0.25);color:#e0b862;}
  .badge.rosso{background:rgba(156,58,46,0.25);color:#e08a7a;}
  .co2{ text-align:center; font-size:11px; color:var(--seppia-dim); margin-bottom:20px; line-height:1.5; }

  .controlli{ display:flex; gap:8px; margin-bottom:16px; }
  select{
    flex:1; background:var(--nero); color:var(--seppia); border:0.5px solid var(--bordo);
    border-radius:7px; padding:9px 10px; font-size:12px; font-family:inherit;
  }

  .stat-riga{ display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--bordo); border-radius:8px; overflow:hidden; margin-bottom:16px; }
  .stat-cella{ background:var(--nero2); padding:11px 13px; }
  .stat-label{ font-size:10px; color:var(--seppia-dim); text-transform:uppercase; letter-spacing:0.5px; }
  .stat-valore{ font-size:17px; margin-top:2px; }
  .stat-nota{ font-size:10px; color:var(--seppia-dim); margin-top:3px; line-height:1.4; }

  .consiglio{ border-radius:9px; padding:13px 15px; margin-bottom:8px; border:0.5px solid var(--bordo); background:var(--nero); }
  .consiglio.adesso{ border-color:var(--verde); background:rgba(92,122,79,0.10); }
  .consiglio.aspetta{ border-color:var(--rosso); background:rgba(156,58,46,0.10); }
  .consiglio-kicker{ font-size:9px; text-transform:uppercase; letter-spacing:0.8px; color:var(--seppia-dim); margin-bottom:5px; }
  .consiglio-titolo{ font-size:15px; margin-bottom:5px; }
  .consiglio-testo{ font-size:12.5px; line-height:1.55; color:#cbbea4; }

  .curva{ margin:14px 0 6px; }
  .curva-barre{ display:flex; align-items:flex-end; gap:2px; height:64px; }
  .curva-col{ flex:1; display:flex; flex-direction:column; justify-content:flex-end; height:100%; }
  .curva-barra{ width:100%; background:var(--bordo); border-radius:2px 2px 0 0; min-height:2px; }
  .curva-barra.ott{ background:var(--verde); }
  .curva-barra.ora{ background:var(--seppia-dim); }
  .curva-assi{ display:flex; gap:2px; margin-top:4px; }
  .curva-ora{ flex:1; text-align:center; font-size:8px; color:var(--seppia-dim); }
  .curva-legenda{ font-size:10px; color:var(--seppia-dim); margin-top:8px; line-height:1.5; }

  .sezione-titolo{ font-size:10px; text-transform:uppercase; letter-spacing:0.6px; color:var(--seppia-dim); margin:22px 0 10px; }
  .barra-riga{ display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:12px; }
  .barra-label{ width:112px; flex-shrink:0; color:var(--seppia-dim); }
  .barra-track{ flex:1; height:7px; background:var(--bordo); border-radius:4px; overflow:hidden; }
  .barra-fill{ height:100%; background:var(--rosso); border-radius:4px; }
  .barra-pct{ width:44px; text-align:right; flex-shrink:0; }

  .zone-grid{ display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .zona{ background:var(--nero); border:0.5px solid var(--bordo); border-radius:7px; padding:9px 11px; }
  .zona.sel{ border-color:var(--seppia-dim); }
  .zona-nome{ font-size:10px; color:var(--seppia-dim); }
  .zona-prezzo{ font-size:15px; margin-top:2px; }

  .avviso{ font-size:10px; color:#e0b862; margin-top:4px; line-height:1.4; }
  .note{ font-size:10.5px; color:var(--seppia-dim); margin-top:18px; line-height:1.6; border-top:0.5px solid var(--bordo); padding-top:12px; }
  .note-titolo{ text-transform:uppercase; letter-spacing:0.6px; font-size:9px; margin-bottom:6px; }
  .note ul{ margin:0; padding-left:15px; }
  .note li{ margin-bottom:5px; }
  .problemi{ font-size:10px; color:var(--seppia-dim); margin-top:16px; line-height:1.6; border-top:0.5px solid var(--bordo); padding-top:11px; }
  .footer{ text-align:center; font-size:10px; color:var(--seppia-dim); margin-top:16px; line-height:1.7; }
  .stato{ text-align:center; color:var(--seppia-dim); font-size:13px; padding:30px 0; }
</style>
</head>
<body>

<div class="card">
  <h1>Meteo elettrico — Italia</h1>
  <div id="contenuto"><div class="stato">Carico i dati da ENTSO-E…</div></div>
</div>

<script>
const ICONE = {
  'Solare':'☀️','Eolico onshore':'💨','Eolico offshore':'💨',
  'Idro (fluente)':'🌊','Idro (bacino)':'🌊','Idro (pompaggio)':'🌊',
  'Nucleare':'⚛️','Gas':'🔥','Carbone':'🔥','Lignite':'🔥','Petrolio':'🔥',
  'Torba':'🔥','Scisto bituminoso':'🔥','Gas da carbone':'🔥',
  'Biomasse':'🌱','Geotermico':'🌋','Rifiuti':'🗑️','Altro rinnovabile':'🌱','Altro':'⚡'
};

let DATI = null;
let ZONA_SEL = localStorage_get('zona') || 'IT_NORD';
let DURATA = 2;

// localStorage non è disponibile ovunque: wrapper prudente
function localStorage_get(k){ try{ return window.localStorage.getItem(k); }catch(e){ return null; } }
function localStorage_set(k,v){ try{ window.localStorage.setItem(k,v); }catch(e){} }

function num(n){ return n===null||n===undefined ? '—' : n.toLocaleString('it-IT'); }
function hh(iso){
  try{ return new Intl.DateTimeFormat('it-IT',{hour:'2-digit',hour12:false,timeZone:'Europe/Rome'}).format(new Date(iso)); }
  catch(e){ return String(new Date(iso).getHours()).padStart(2,'0'); }
}

function disegnaCurva(zona){
  const c = zona.consiglio;
  if(!zona.curva || zona.curva.length<2) return '';
  const vals = zona.curva.map(p=>p.v);
  const min = Math.min(...vals), max = Math.max(...vals), range = (max-min)||1;
  const inizioOtt = c.finestraOttimaleInizio ? new Date(c.finestraOttimaleInizio).getTime() : null;
  const fineOtt = inizioOtt ? inizioOtt + (c.durataOre||2)*3600000 : null;

  let barre='', assi='';
  zona.curva.slice(0,24).forEach(function(p,i){
    const t = new Date(p.t).getTime();
    const h = 8 + ((p.v-min)/range)*56;
    let cls='';
    if(inizioOtt && t>=inizioOtt && t<fineOtt) cls=' ott';
    else if(i===0) cls=' ora';
    barre += '<div class="curva-col"><div class="curva-barra'+cls+'" style="height:'+h.toFixed(0)+'px" title="'+hh(p.t)+':00 — '+p.v.toFixed(1)+' €/MWh"></div></div>';
    assi += '<div class="curva-ora">'+(i%3===0?hh(p.t):'')+'</div>';
  });

  return '<div class="curva">' +
    '<div class="curva-barre">'+barre+'</div>' +
    '<div class="curva-assi">'+assi+'</div>' +
    '<div class="curva-legenda">Prezzo €/MWh ora per ora, da adesso in avanti. ' +
    '<span style="color:#9dc189;">■</span> finestra consigliata · ' +
    '<span style="color:var(--seppia-dim);">■</span> ora corrente. ' +
    'Min '+min.toFixed(1)+' · max '+max.toFixed(1)+'.</div></div>';
}

function render(){
  const d = DATI;
  const box = document.getElementById('contenuto');
  const zona = (d.zone||[]).find(z=>z.code===ZONA_SEL) || (d.zone||[])[0];

  const ora = new Date(d.updated).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Rome'});
  const icona = ICONE[d.dominant] || '⚡';

  let html = '';

  if(d.dominant){
    html += '<div class="icona">'+icona+'</div><div class="dominante">'+d.dominant+
      (d.indexLabel?'<span class="badge '+d.indexLabel+'">'+d.indexLabel+'</span>':'')+'</div>';
    if(d.co2Intensity!==null){
      html += '<div class="co2">~'+d.co2Intensity+' gCO₂/kWh · '+num(d.totalGenerationMw)+' MW generati</div>';
    }
  }

  // selettori
  let opzZone = (d.zone||[]).map(z=>'<option value="'+z.code+'"'+(z.code===ZONA_SEL?' selected':'')+'>Zona '+z.name+'</option>').join('');
  let opzDur = [1,2,3,4].map(n=>'<option value="'+n+'"'+(n===DURATA?' selected':'')+'>'+n+' '+(n===1?'ora':'ore')+' di consumo</option>').join('');
  html += '<div class="controlli"><select id="selZona">'+opzZone+'</select><select id="selDurata">'+opzDur+'</select></div>';

  html += '<div class="stat-riga">' +
    '<div class="stat-cella"><div class="stat-label">Domanda ora</div><div class="stat-valore">'+
      (d.loadMw!==null?num(d.loadMw)+' MW':'—')+'</div>'+
      (d.avvisoDomanda?'<div class="avviso">'+d.avvisoDomanda+'</div>':'')+'</div>' +
    '<div class="stat-cella"><div class="stat-label">Prezzo '+(zona?zona.name:'')+'</div><div class="stat-valore">'+
      (zona&&zona.prezzoAdesso!==null?zona.prezzoAdesso.toFixed(2)+' €/MWh':'—')+'</div></div></div>';

  // consiglio prezzo
  if(zona && zona.consiglio && zona.consiglio.tipo!=='indisponibile'){
    const c = zona.consiglio;
    html += '<div class="consiglio '+c.tipo+'">' +
      '<div class="consiglio-kicker">Se hai un contratto indicizzato all\'ora</div>' +
      '<div class="consiglio-titolo">'+(c.titolo||'')+'</div>' +
      '<div class="consiglio-testo">'+(c.testo||'')+'</div>' +
      disegnaCurva(zona) + '</div>';
  }

  // consiglio ambientale
  if(d.verde){
    html += '<div class="consiglio '+d.verde.tipo+'">' +
      '<div class="consiglio-kicker">Segnale ambientale — vale con qualsiasi tariffa</div>' +
      '<div class="consiglio-testo">'+d.verde.testo+'</div></div>';
  }

  if(d.mix && d.mix.length){
    html += '<div class="sezione-titolo">Mix di generazione ora</div>';
    d.mix.slice(0,9).forEach(function(v){
      html += '<div class="barra-riga"><div class="barra-label">'+v.label+'</div>' +
        '<div class="barra-track"><div class="barra-fill" style="width:'+v.pct+'%"></div></div>' +
        '<div class="barra-pct">'+v.pct+'%</div></div>';
    });
  }

  if(d.zone && d.zone.length){
    html += '<div class="sezione-titolo">Prezzo per zona</div><div class="zone-grid">';
    d.zone.forEach(function(z){
      html += '<div class="zona'+(z.code===ZONA_SEL?' sel':'')+'"><div class="zona-nome">'+z.name+'</div>' +
        '<div class="zona-prezzo">'+(z.prezzoAdesso!==null?z.prezzoAdesso.toFixed(2):'—')+' €/MWh</div></div>';
    });
    html += '</div>';
  }

  if(d.problemi && d.problemi.length){
    html += '<div class="problemi"><strong>Dati non disponibili:</strong><br>'+d.problemi.join('<br>')+'</div>';
  }

  if(d.note){
    html += '<div class="note"><div class="note-titolo">Come vanno letti questi numeri</div><ul>' +
      '<li>'+d.note.co2+'</li>' +
      '<li>'+d.note.prezzo+'</li>' +
      '<li>'+d.note.media+'</li>' +
      '<li>'+d.note.mix+'</li>' +
      '</ul></div>';
  }

  html += '<div class="footer">Aggiornato alle '+ora+' (ora italiana) · fonte '+d.fonte+'</div>';

  box.innerHTML = html;

  document.getElementById('selZona').addEventListener('change', function(e){
    ZONA_SEL = e.target.value; localStorage_set('zona', ZONA_SEL); render();
  });
  document.getElementById('selDurata').addEventListener('change', function(e){
    DURATA = parseInt(e.target.value,10); carica();
  });
}

async function carica(){
  const box = document.getElementById('contenuto');
  if(!DATI) box.innerHTML = '<div class="stato">Carico i dati da ENTSO-E…</div>';
  try{
    const res = await fetch('/.netlify/functions/mix?durata='+DURATA, { cache:'no-store' });
    const d = await res.json();
    if(d.error){ box.innerHTML = '<div class="stato">'+d.error+'</div>'; return; }
    DATI = d; render();
  }catch(err){
    box.innerHTML = '<div class="stato">Errore di connessione. Riprova tra poco.</div>';
  }
}

carica();
setInterval(carica, 5*60*1000);
</script>

</body>
</html>
